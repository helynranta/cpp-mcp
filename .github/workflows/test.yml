name: CI Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check-formatting:
    name: Check Code Formatting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run clang-format check
      run: |
        # Find all C++ source and header files
        files=$(find src include examples test -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" -o -name "*.cppm" \) 2>/dev/null || true)
        
        if [ -z "$files" ]; then
          echo "No C++ files found to check"
          exit 0
        fi
        
        # Run clang-format in check mode
        echo "Checking formatting for C++ files..."
        clang-format --dry-run --Werror $files
        
        if [ $? -ne 0 ]; then
          echo ""
          echo "❌ Formatting check failed!"
          echo ""
          echo "Please format your code using:"
          echo "  find src include examples test -name '*.cpp' -o -name '*.h' | xargs clang-format -i"
          echo ""
          echo "Or format specific files:"
          echo "  clang-format -i <file1> <file2> ..."
          exit 1
        fi
        
        echo "✅ All files are properly formatted"

  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest
    needs: check-formatting
    
    env:
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg-cache,readwrite'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Restore vcpkg cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/vcpkg-cache
        key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-
    
    - name: Install vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: 'vcpkg.json'
    
    - name: Configure CMake
      run: cmake --preset ci-linux
    
    - name: Build
      run: cmake --build --preset ci-linux
    
    - name: Run Boost.Test tests
      run: ctest --preset ci-linux
  
  test-windows:
    name: Test on Windows
    runs-on: windows-latest
    needs: check-formatting
    
    env:
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg-cache,readwrite'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Restore vcpkg cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/vcpkg-cache
        key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-
    
    - name: Install vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: 'vcpkg.json'
    
    - name: Configure CMake
      run: cmake --preset ci-windows
    
    - name: Build
      run: cmake --build --preset ci-windows
    
    - name: Run Boost.Test tests
      run: ctest --preset ci-windows
