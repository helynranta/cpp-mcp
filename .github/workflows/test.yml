name: CI Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  packages: write

jobs:
  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest
    
    env:
      VCPKG_BINARY_SOURCES: 'clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup NuGet credentials
      run: |
        mono $(vcpkg fetch nuget | tail -n 1) sources add \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
          -storepasswordincleartext \
          -name "GitHubPackages" \
          -username "${{ github.repository_owner }}" \
          -password "${{ secrets.GITHUB_TOKEN }}"
        mono $(vcpkg fetch nuget | tail -n 1) setapikey "${{ secrets.GITHUB_TOKEN }}" \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
    
    - name: Install vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: 'vcpkg.json'
    
    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
          -DMCP_BUILD_TESTS=ON \
          -DVCPKG_MANIFEST_FEATURES="tests" \
          -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: cmake --build build --config Release -j$(nproc)
    
    - name: Run GoogleTest tests
      run: |
        cd build
        ctest --output-on-failure -C Release -R mcp_tests
  
  test-windows:
    name: Test on Windows
    runs-on: windows-latest
    
    env:
      VCPKG_BINARY_SOURCES: 'clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup NuGet credentials
      shell: pwsh
      run: |
        & $(vcpkg fetch nuget | Select-Object -Last 1) sources add `
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
          -storepasswordincleartext `
          -name "GitHubPackages" `
          -username "${{ github.repository_owner }}" `
          -password "${{ secrets.GITHUB_TOKEN }}"
        & $(vcpkg fetch nuget | Select-Object -Last 1) setapikey "${{ secrets.GITHUB_TOKEN }}" `
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
    
    - name: Install vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: 'vcpkg.json'
    
    - name: Configure CMake
      run: |
        cmake -B build `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DMCP_BUILD_TESTS=ON `
          -DVCPKG_MANIFEST_FEATURES="tests" `
          -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS
    
    - name: Run GoogleTest tests
      run: |
        cd build
        ctest --output-on-failure -C Release -R mcp_tests
