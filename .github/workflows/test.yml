name: CI Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Build and Test
    runs-on: windows-latest
    
    env:
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg-cache,readwrite'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install latest CMake
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: '~4.2.0'
        ninjaVersion: '^1.11.1'
    
    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
    
    - name: Restore vcpkg cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/vcpkg-cache
        key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-
    
    - name: Install vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: 'vcpkg.json'
    
    - name: Check code formatting
      shell: pwsh
      run: |
        # Find all C++ source and header files
        $files = Get-ChildItem -Path src,include,examples,test -Include *.cpp,*.h,*.hpp,*.cppm -Recurse -ErrorAction SilentlyContinue
        
        if ($files.Count -eq 0) {
          Write-Host "No C++ files found to check"
          exit 0
        }
        
        # Run clang-format in check mode
        Write-Host "Checking formatting for $($files.Count) C++ files..."
        $failed = $false
        foreach ($file in $files) {
          & clang-format --dry-run --Werror $file.FullName
          if ($LASTEXITCODE -ne 0) {
            $failed = $true
          }
        }
        
        if ($failed) {
          Write-Host ""
          Write-Host "❌ Formatting check failed!"
          Write-Host ""
          Write-Host "Please format your code using:"
          Write-Host "  clang-format -i src/**/*.cpp include/**/*.h examples/**/*.cpp test/**/*.cpp"
          Write-Host ""
          Write-Host "Or format specific files:"
          Write-Host "  clang-format -i <file1> <file2> ..."
          exit 1
        }
        
        Write-Host "✅ All files are properly formatted"
    
    - name: Configure CMake
      run: cmake --preset ci
    
    - name: Build
      run: cmake --build --preset ci
    
    - name: Run Boost.Test tests
      run: ctest --preset ci

    - name: Install to staging prefix
      run: cmake --install build/ci --prefix "${{ github.workspace }}/install-staging" --config Release

    - name: Verify installed package config files
      shell: pwsh
      run: |
        $prefix = "${{ github.workspace }}/install-staging"
        $required = @(
          "lib/cmake/mcp/mcpConfig.cmake",
          "lib/cmake/mcp/mcpConfigVersion.cmake",
          "lib/cmake/mcp/mcpTargets.cmake"
        )
        $missing = $false
        foreach ($rel in $required) {
          $full = Join-Path $prefix $rel
          if (-not (Test-Path $full)) {
            Write-Host "MISSING: $full"
            $missing = $true
          } else {
            Write-Host "OK: $full"
          }
        }
        if ($missing) { exit 1 }
        Write-Host "All expected install artifacts present."

    - name: Test downstream find_package(mcp) usage
      shell: pwsh
      run: |
        # Write a minimal downstream CMakeLists.txt that uses find_package(mcp)
        $downstreamDir = "${{ github.workspace }}/downstream-test"
        New-Item -ItemType Directory -Force -Path $downstreamDir | Out-Null

        $prefix = "${{ github.workspace }}/install-staging"
        $cmakeContent = "cmake_minimum_required(VERSION 3.25)`n" +
          "project(DownstreamTest LANGUAGES CXX)`n" +
          "set(CMAKE_CXX_STANDARD 23)`n" +
          "set(CMAKE_CXX_STANDARD_REQUIRED ON)`n" +
          "add_compile_definitions(_WIN32_WINNT=0x0A00)`n" +
          "find_package(mcp REQUIRED CONFIG)`n" +
          "add_executable(downstream_test main.cpp)`n" +
          "target_link_libraries(downstream_test PRIVATE mcp::mcp)`n"
        Set-Content -Path "$downstreamDir/CMakeLists.txt" -Value $cmakeContent

        $mainContent = "#include <mcp_server.h>`nint main() { return 0; }`n"
        Set-Content -Path "$downstreamDir/main.cpp" -Value $mainContent

        cmake -B "$downstreamDir/build" -G Ninja `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_MANIFEST_INSTALL=OFF `
          -DVCPKG_INSTALLED_DIR="${{ github.workspace }}/build/ci/vcpkg_installed" `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="$prefix" `
          "$downstreamDir"
        if ($LASTEXITCODE -ne 0) { exit 1 }

        cmake --build "$downstreamDir/build" --config Release
        if ($LASTEXITCODE -ne 0) { exit 1 }

        Write-Host "Downstream find_package(mcp) build succeeded."
