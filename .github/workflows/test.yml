name: CI Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: 'vcpkg.json'
    
    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
          -DMCP_BUILD_TESTS=ON \
          -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: cmake --build build --config Release -j$(nproc)
    
    - name: Run MCP 2025-03-26 Conformance Tests (REQUIRED)
      run: |
        cd build
        ctest --output-on-failure -C Release -R mcp_tests --verbose
    
    - name: Generate Conformance Report
      if: always()
      run: |
        cd build
        ctest --output-on-failure -C Release -R mcp_tests --verbose > conformance_report_linux.txt 2>&1 || true
    
    - name: Upload Conformance Report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: conformance-report-linux
        path: build/conformance_report_linux.txt
  
  test-windows:
    name: Test on Windows
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: 'vcpkg.json'
    
    - name: Configure CMake
      run: |
        cmake -B build `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DMCP_BUILD_TESTS=ON `
          -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS
    
    - name: Run MCP 2025-03-26 Conformance Tests (REQUIRED)
      run: |
        cd build
        ctest --output-on-failure -C Release -R mcp_tests --verbose
    
    - name: Generate Conformance Report
      if: always()
      run: |
        cd build
        ctest --output-on-failure -C Release -R mcp_tests --verbose > conformance_report_windows.txt 2>&1
      continue-on-error: true
    
    - name: Upload Conformance Report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: conformance-report-windows
        path: build/conformance_report_windows.txt
  
  test-macos:
    name: Test on macOS
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: 'vcpkg.json'
    
    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
          -DMCP_BUILD_TESTS=ON \
          -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: cmake --build build --config Release -j$(sysctl -n hw.ncpu)
    
    - name: Run MCP 2025-03-26 Conformance Tests (REQUIRED)
      run: |
        cd build
        ctest --output-on-failure -C Release -R mcp_tests --verbose
    
    - name: Generate Conformance Report
      if: always()
      run: |
        cd build
        ctest --output-on-failure -C Release -R mcp_tests --verbose > conformance_report_macos.txt 2>&1 || true
    
    - name: Upload Conformance Report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: conformance-report-macos
        path: build/conformance_report_macos.txt
  
  # Conformance gate - all platforms must pass
  conformance-gate:
    name: MCP 2025-03-26 Conformance Gate
    runs-on: ubuntu-latest
    needs: [test-linux, test-windows, test-macos]
    if: always()
    
    steps:
    - name: Check conformance test results
      run: |
        if [ "${{ needs.test-linux.result }}" != "success" ] || \
           [ "${{ needs.test-windows.result }}" != "success" ] || \
           [ "${{ needs.test-macos.result }}" != "success" ]; then
          echo "❌ MCP 2025-03-26 Conformance tests failed on one or more platforms"
          echo "Linux: ${{ needs.test-linux.result }}"
          echo "Windows: ${{ needs.test-windows.result }}"
          echo "macOS: ${{ needs.test-macos.result }}"
          exit 1
        else
          echo "✅ MCP 2025-03-26 Conformance tests passed on all platforms"
        fi

