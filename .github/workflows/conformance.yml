name: MCP Conformance Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  conformance:
    name: Run MCP Conformance Tests
    runs-on: windows-latest
    
    env:
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg-cache,readwrite'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-
      
      - name: Install vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
      
      - name: Configure CMake
        run: cmake --preset ci-windows
      
      - name: Build
        run: cmake --build --preset ci-windows --target server_example
      
      - name: Start MCP server
        shell: pwsh
        run: ./.github/scripts/start-mcp-server.ps1
      
      - name: Run conformance tests
        uses: modelcontextprotocol/conformance@v0.1.14
        with:
          mode: server
          url: http://127.0.0.1:3001/mcp
          suite: active
          expected-failures: ./conformance-baseline.yml
          verbose: true
      
      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: results/
          retention-days: 30
          if-no-files-found: warn
      
      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            server-stdout.log
            server-stderr.log
          retention-days: 30
          if-no-files-found: warn
      
      - name: Stop server
        if: always()
        shell: pwsh
        run: |
          if ($env:SERVER_PID) {
            Write-Host "Stopping server (PID: $env:SERVER_PID)..."
            try {
              Stop-Process -Id $env:SERVER_PID -Force -ErrorAction SilentlyContinue
              Write-Host "Server stopped"
            } catch {
              Write-Host "Failed to stop server: $_"
            }
          }
