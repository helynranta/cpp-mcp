name: MCP Conformance Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  conformance:
    name: Run MCP Conformance Tests
    runs-on: windows-latest
    
    env:
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg-cache,readwrite'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install latest CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '~4.2.0'
          ninjaVersion: '^1.11.1'
      
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-
      
      - name: Install vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
      
      - name: Configure CMake
        run: cmake --preset ci
      
      - name: Build
        run: cmake --build --preset ci-windows --target server_example

      - name: Setup Node.js for conformance build
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run conformance tests
        shell: pwsh
        run: >-
          ./.github/scripts/run-conformance-tests.ps1
          -ExpectedFailures ./conformance-baseline.yml

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            server-stdout.log
            server-stderr.log
          retention-days: 30
          if-no-files-found: warn

      - name: Stop server (safety net)
        if: always()
        shell: pwsh
        run: |
          if ($env:SERVER_PID) {
            Write-Host "Safety-net stop for PID $env:SERVER_PID"
            Stop-Process -Id $env:SERVER_PID -Force -ErrorAction SilentlyContinue
          }
